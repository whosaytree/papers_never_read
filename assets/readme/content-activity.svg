<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Content activity heatmap for May 2026</title>
  <desc id="desc">A calendar heatmap showing daily additions to the paper database, technical blog notes, and code projects.</desc>
  <style>
    .panel{fill:#ffffff;stroke:#d0d7de}
    .title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}
    .subtitle{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}
    .metric-label{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}
    .metric-value{font:800 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}
    .weekday{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}
    .day{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .count{font:800 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .muted{fill:#8c959f}
    .dark{fill:#24292f}
    .light{fill:#ffffff}
    .empty{fill:#f6f8fa;stroke:#d0d7de}
    .zero{fill:#ebedf0;stroke:#d0d7de}
    .lvl1{fill:#9be9a8;stroke:#6bc77b}
    .lvl2{fill:#40c463;stroke:#2da44e}
    .lvl3{fill:#30a14e;stroke:#238636}
    .lvl4{fill:#216e39;stroke:#1a5f30}
    .legend{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}
    @media (prefers-color-scheme: dark){
      .panel{fill:#0d1117;stroke:#30363d}
      .title,.metric-value{fill:#e6edf3}
      .subtitle,.metric-label,.weekday,.legend{fill:#8b949e}
      .empty{fill:#161b22;stroke:#30363d}
      .zero{fill:#161b22;stroke:#30363d}
      .dark{fill:#e6edf3}
      .muted{fill:#8b949e}
    }
  </style>

